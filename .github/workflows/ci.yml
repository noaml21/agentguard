name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing test piped through tee fails the step

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  v1:
    name: V1 regression + red-team corpus
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bash coreutils gcc git jq python3 util-linux

      - name: Validate test harness syntax
        run: bash -n tests/run_tests.sh

      - name: V1 regression suite
        run: ./tests/run_tests.sh

      - name: V1 red-team corpus (results must match the committed baseline)
        run: |
          python3 redteam/run_v1.py
          git diff --exit-code redteam/results/v1_results.json

  v2:
    name: V2 ${{ matrix.tier }}
    # Pinned: ubuntu-latest moves to a new release in Oct 2026; capability claims
    # below are for this image (kernel reported by the capability step).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tier: [check, check-asan, redteam]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bash coreutils gcc make git jq perl python3 util-linux

      - name: Host capability report (informational, unprivileged)
        run: |
          uname -a
          bash scripts/capability_audit.sh

      - name: Warning-clean production build (-Wall -Wextra -Werror ...)
        run: make -C sandbox all

      - name: Kernel-feature preflight
        id: preflight
        run: |
          sandbox/build/agentguard-run --status
          sandbox/build/agentguard-run --status --json > status.json
          missing="$(python3 -c 'import json; print(" ".join(l["name"] for l in json.load(open("status.json"))["layers"] if l["required"] and not l["available"]))')"
          if [[ -n "$missing" ]]; then
            echo "::warning title=Kernel-feature tier SKIPPED::required layer(s) unavailable on this runner kernel: $missing. Strict mode refuses by design; nothing in this tier is verified here."
            echo "kernel_ok=false" >> "$GITHUB_OUTPUT"
            echo "### ${{ matrix.tier }}: SKIPPED — unavailable required layers: $missing ($(uname -r))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "kernel_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: V2 suites (make -C sandbox ${{ matrix.tier }})
        if: steps.preflight.outputs.kernel_ok == 'true' && matrix.tier != 'redteam'
        run: |
          make -C sandbox ${{ matrix.tier }} 2>&1 | tee tier.log
          {
            echo "### ${{ matrix.tier }} on $(uname -r)"
            echo "PASS lines: $(grep -c '^PASS' tier.log); python: $(grep '^Ran ' tier.log | tr '\n' ' ')"
            echo "Explicit skips (not verified on this runner):"
            echo '```'
            grep -E '^SKIP' tier.log || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qiE 'AddressSanitizer|LeakSanitizer|runtime error' tier.log; then
            echo "::error::sanitizer report found"; exit 1
          fi

      - name: V2 red-team replay + V1 comparison (outcomes must match the committed matrix)
        if: steps.preflight.outputs.kernel_ok == 'true' && matrix.tier == 'redteam'
        run: |
          cp redteam/results/v2_results.json "$RUNNER_TEMP/committed.json"
          python3 redteam/run_v2.py --require-kernel
          python3 - "$RUNNER_TEMP/committed.json" redteam/results/v2_results.json <<'PY'
          import json, sys
          keys = ("id", "effect_target", "v1_outcome", "baseline_effect", "v2_effect", "v2_outcome")
          a, b = (json.load(open(p)) for p in sys.argv[1:3])
          rows = lambda d: [{k: r[k] for k in keys} for r in d["results"]]
          diff = [(x, y) for x, y in zip(rows(a), rows(b)) if x != y]
          if diff or len(a["results"]) != len(b["results"]):
              print("matrix differs from the committed artifact:", diff); sys.exit(1)
          print("matrix identical to the committed artifact:", b["summary"])
          PY
